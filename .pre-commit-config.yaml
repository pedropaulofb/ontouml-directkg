# Light file-hygiene checks. Preserve normative sources, fixtures and published artifacts.
ci:
  autofix_prs: false
  autoupdate_schedule: quarterly

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: '^(?:\.gitignore$|branding/|documentation/site/assets/|documentation/site/examples/files/|documentation/specification/archive/|tests/(?:coverage\.md$|fixtures/)|vocabulary/(?:latest|versioned)/)'
      - id: end-of-file-fixer
        exclude: '^(?:\.gitignore$|branding/|documentation/site/assets/|documentation/site/examples/files/|documentation/specification/archive/|documentation/specification/(?:2026-10-21 - test suite structure\.md$|prompts/adviser-01-initialize-and-operate\.md$)|tests/(?:coverage\.md$|fixtures/)|vocabulary/(?:latest|versioned)/)'
      - id: check-yaml
      - id: check-json
        exclude: '^tests/fixtures/transformation/input_diagnostics/unprocessable/input\.json$'
      - id: check-toml
      - id: check-merge-conflict
      - id: check-ast
      - id: check-case-conflict
      - id: check-illegal-windows-names
