# Light file-hygiene checks. Preserve normative sources, fixtures and published artifacts.
ci:
  autofix_prs: false
  autoupdate_schedule: quarterly

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: '^(?:\.gitignore$|documentation/specification/|documentation/site/examples/files/|tests/(?:coverage\.md$|fixtures/)|vocabulary/(?:latest|versioned)/|.*\.html$)'
      - id: end-of-file-fixer
        exclude: '^(?:\.gitignore$|documentation/specification/|documentation/site/examples/files/|tests/(?:coverage\.md$|fixtures/)|vocabulary/(?:latest|versioned)/|.*\.html$)'
      - id: check-yaml
      - id: check-json
        exclude: '^tests/fixtures/transformation/input_diagnostics/unprocessable/input\.json$'
      - id: check-toml
      - id: check-merge-conflict
