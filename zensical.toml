[project]
site_name = "OntoUML DirectKG"
site_description = "Accepted contracts and mapping guidance for domain-oriented OntoUML to RDF/OWL conversion."
# Configured deployment target, not a claim of successful Pages publication.
site_url = "https://pedropaulofb.github.io/ontouml-directkg/"
repo_url = "https://github.com/pedropaulofb/ontouml-directkg"
docs_dir = "documentation/site"
site_dir = "site"
nav = [
  { "Home" = "index.md" },
  { "Guides" = [
    { "CLI guide" = "guides/cli.md" },
    { "Python guide" = "guides/python.md" },
    { "Metadata and provenance" = "guides/metadata-and-provenance.md" },
  ] },
  { "Semantics and limitations" = "concepts/semantics.md" },
  { "Mapping reference" = [
    { "Classes and enumerations" = "mapping/classes.md" },
    { "Higher-order classification" = "mapping/higher-order.md" },
    { "Attributes and datatypes" = "mapping/attributes-and-datatypes.md" },
    { "Binary relations" = "mapping/relations.md" },
    { "Inverse properties" = "mapping/inverses.md" },
    { "Property features" = "mapping/property-features.md" },
    { "Derivations and material chains" = "mapping/derivations-and-chains.md" },
    { "Mereology and DKGM" = "mapping/mereology.md" },
    { "Instantiation associations" = "mapping/instantiation.md" },
  ] },
  { "Reference" = [
    { "Input contract" = "reference/input.md" },
    { "Output contract" = "reference/output.md" },
    { "Controls" = "reference/controls.md" },
    { "Identifiers and naming" = "reference/identifiers.md" },
    { "Persistent identifiers and redirects" = "reference/persistent-identifiers.md" },
    { "Labels, comments, and language" = "reference/text.md" },
    { "Diagnostics and recovery" = "reference/diagnostics.md" },
  ] },
  { "Examples" = "examples/index.md" },
  { "Contributing" = "development/contributing.md" },
]

[project.validation]
invalid_links = true
invalid_link_anchors = true

# No source paths or API-object directives until real public modules exist.
[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]

[project.theme]
logo = "assets/favicon.svg"
favicon = "assets/favicon.svg"
