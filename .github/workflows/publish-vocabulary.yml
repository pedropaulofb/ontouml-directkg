name: Validate and publish DirectKG vocabulary

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: directkg-vocabulary-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: vocabulary/scripts/requirements.txt
      - run: python -m pip install -r vocabulary/scripts/requirements.txt
      - name: Validate release immutability and generate representations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python vocabulary/scripts/build.py --base "$BASE_SHA"
      - run: python -m unittest discover -s vocabulary/scripts/tests -v

  prepare:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: vocabulary/scripts/requirements.txt
      - run: python -m pip install -r vocabulary/scripts/requirements.txt
      - name: Confirm main has not advanced
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || {
            echo "::error::main advanced; the newer workflow run will publish its commit."
            exit 1
          }
      - name: Build vocabulary representations
        run: python vocabulary/scripts/build.py
      - name: Commit generated representations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vocabulary/latest vocabulary/versioned/*.html
          if ! git diff --cached --quiet; then
            git commit -m "docs(vocabulary): publish current DirectKG representations"
            git push origin HEAD:main
          fi
      - name: Record prepared publication revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish-site:
    needs: prepare
    uses: ./.github/workflows/docs.yml
    with:
      source_ref: ${{ needs.prepare.outputs.source_sha }}
    permissions:
      contents: read
      pages: write
      id-token: write
