name: Approve Dependabot after CI

on:
  workflow_run:
    workflows: ["Validate and publish DirectKG vocabulary"]
    types: [completed]

# The privileged follow-up never checks out or executes PR code.
permissions:
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: dependabot-approval-${ github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

jobs:
  approve:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Approve only the successfully checked Dependabot revision
        env:
          GH_TOKEN: ${ github.token }}
          TESTED_SHA: ${ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          # Link the completed CI run to exactly one same-repository PR.
          mapfile -t matches < <(jq -r --arg sha "$TESTED_SHA" '
            .workflow_run.pull_requests[]?
            | select(.head.sha == $sha and .head.repo.id == .base.repo.id and .base.ref == "main")
            | .number
          ' "$GITHUB_EVENT_PATH")
          if (( ${#matches[@]} != 1 )); then
            echo 'No unique matching PR in the CI run; no approval.'
            exit 0
          fi
          pr="${matches[0]}"

          # The workflow event is not authority for the *current* PR identity.
          current="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr")"
          if ! jq -e --arg sha "$TESTED_SHA" --arg repo "$GITHUB_REPOSITORY" '
            .state == "open" and .draft == false and
            .base.ref == "main" and .head.sha == $sha and
            .head.repo.full_name == $repo and
            .user.login == "dependabot[bot]" and .user.id == 49699333
          ' <<< "$current" > /dev/null; then
            echo 'PR is not a current, genuine Dependabot update; no approval.'
            exit 0
          fi

          # Include external commit statuses, not just the triggering workflow.
          # Failed, cancelled, and pending checks block approval.
          gh pr checks "$pr" --repo "$GITHUB_REPOSITORY" --watch --fail-fast
          checks="$(gh pr checks "$pr" --repo "$GITHUB_REPOSITORY" --json name,workflow,bucket)"
          jq -e '
            any(.[]; .name == "validate" and
              .workflow == "Validate and publish DirectKG vocabulary" and
              .bucket == "pass") and
            all(.[]; .bucket == "pass" or .bucket == "skipping")
          ' <<< "$checks" > /dev/null

          # Reject stale runs, including PR updates made while waiting for checks.
          current="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr")"
          jq -e --arg sha "$TESTED_SHA" --arg repo "$GITHUB_REPOSITORY" '
            .state == "open" and .draft == false and
            .base.ref == "main" and .head.sha == $sha and
            .head.repo.full_name == $repo and
            .user.login == "dependabot[bot]" and .user.id == 49699333
          ' <<< "$current" > /dev/null || exit 0

          # A successful run may be retried. Do not submit duplicate approvals.
          approved="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$pr/reviews" \
            --jq '.[] | select(.state == "APPROVED" and .user.login == "github-actions[bot]") | .commit_id')"
          if grep -Fxq "$TESTED_SHA" <<< "$approved"; then
            echo 'Current commit already approved by github-actions[bot].'
            exit 0
          fi

          # Anchor the approval to the tested commit (never enable auto-merge).
          gh api --method POST "repos/$GITHUB_REPOSITORY/pulls/$pr/reviews" \
            -f event=APPROVE -f commit_id="$TESTED_SHA" \
            -f body='Dependabot update: all reported PR checks passed for this commit.' \
            --jq '.html_url'
