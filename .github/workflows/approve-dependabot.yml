name: Approve Dependabot after CI

on:
  workflow_run:
    workflows: ["Validate and publish DirectKG vocabulary"]
    types: [completed]

# The privileged follow-up never checks out or executes PR code.
permissions:
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: dependabot-approval-${{ github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

jobs:
  approve:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Approve only the successfully checked Dependabot revision
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          # Link the completed CI run to exactly one same-repository PR.
          mapfile -t matches < <(jq -r --arg sha "$TESTED_SHA" '
            .workflow_run.pull_requests[]?
            | select(.head.sha == $sha and .head.repo.id == .base.repo.id and .base.ref == "main")
            | .number
          ' "$GITHUB_EVENT_PATH")
          if (( ${#matches[@]} != 1 )); then
            echo 'No unique matching PR in the CI run; no approval.'
            exit 0
          fi
          pr="${matches[0]}"

          # The workflow event is not authority for the *current* PR identity.
          current="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr")"
          if ! jq -e --arg sha "$TESTED_SHA" --arg repo "$GITHUB_REPOSITORY" '
            .state == "open" and .draft == false and
            .base.ref == "main" and .head.sha == $sha and
            .head.repo.full_name == $repo and
            .user.login == "dependabot[bot]" and .user.id == 49699333
          ' <<< "$current" > /dev/null; then
            echo 'PR is not a current, genuine Dependabot update; no approval.'
            exit 0
          fi

          # Include external commit statuses, not just the triggering workflow.
          # Failed, cancelled, and pending checks block approval.
          gh pr checks "$pr" --repo "$GITHUB_REPOSITORY" --watch --fail-fast
          checks="$(gh pr checks "$pr" --repo "$GITHUB_REPOSITORY" --json name,workflow,bucket)"
          jq -e '
            any(.[]; .name == "validate" and
              .workflow == "Validate and publish DirectKG vocabulary" and
              .bucket == "pass") and
            all(.[]; .bucket == "pass" or .bucket == "skipping")
          ' <<< "$checks" > /dev/null

          # CLI rollups can omit required checks with no reported status.
          # Read required contexts from branch protection and active rulesets.
          owner="$(cut -d/ -f1 <<< "$GITHUB_REPOSITORY")"
          repo_name="$(cut -d/ -f2 <<< "$GITHUB_REPOSITORY")"
          protection="$(gh api graphql \
            -f query='query($owner: String!, $name: String!) {
              repository(owner: $owner, name: $name) {
                ref(qualifiedName: "refs/heads/main") {
                  branchProtectionRule { requiredStatusChecks { context } }
                }
              }
            }' -f owner="$owner" -f name="$repo_name")"
          jq -e '.data.repository.ref != null' <<< "$protection" > /dev/null
          rules="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/rules/branches/main?per_page=100" | jq -s 'add')"
          required="$(jq -n --argjson protection "$protection" --argjson rules "$rules" '
            [
              $protection.data.repository.ref.branchProtectionRule.requiredStatusChecks[]?.context,
              ($rules[] | select(.type == "required_status_checks") |
                .parameters.required_status_checks[]?.context)
            ] | map(select(. != null)) | unique
          ')"

          # Verify current-head check runs and commit statuses via REST.
          # Poll for required checks that have not appeared yet; fail closed.
          ready=false
          for attempt in $(seq 1 240); do
            runs="$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/commits/$TESTED_SHA/check-runs?per_page=100" |
              jq -s '[.[].check_runs[]] | group_by([.name, .app.id]) | map(max_by(.id))')"
            statuses="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TESTED_SHA/status")"
            if jq -n -e --argjson runs "$runs" --argjson statuses "$statuses" \
              --argjson required "$required" '
              def passed: .status == "completed" and
                (.conclusion == "success" or .conclusion == "neutral" or .conclusion == "skipped");
              (any($runs[]; .name == "validate" and .conclusion == "success" and .status == "completed")) and
              (all($runs[]; passed)) and
              ($statuses.total_count == 0 or $statuses.state == "success") and
              (all($required[]; . as $name |
                any($runs[]; .name == $name and passed) or
                any($statuses.statuses[]; .context == $name and .state == "success")))
            ' > /dev/null; then
              ready=true
              break
            fi
            if (( attempt < 240 )); then sleep 10; fi
          done
          if [[ "$ready" != true ]]; then
            echo "::error::Required or reported checks are missing, pending, or failing."
            exit 1
          fi

          # Reject stale runs, including PR updates made while waiting for checks.
          current="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr")"
          jq -e --arg sha "$TESTED_SHA" --arg repo "$GITHUB_REPOSITORY" '
            .state == "open" and .draft == false and
            .base.ref == "main" and .head.sha == $sha and
            .head.repo.full_name == $repo and
            .user.login == "dependabot[bot]" and .user.id == 49699333
          ' <<< "$current" > /dev/null || exit 0

          # A successful run may be retried. Do not submit duplicate approvals.
          approved="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$pr/reviews" \
            --jq '.[] | select(.state == "APPROVED" and .user.login == "github-actions[bot]") | .commit_id')"
          if grep -Fxq "$TESTED_SHA" <<< "$approved"; then
            echo 'Current commit already approved by github-actions[bot].'
            exit 0
          fi

          # Anchor the approval to the tested commit (never enable auto-merge).
          gh api --method POST "repos/$GITHUB_REPOSITORY/pulls/$pr/reviews" \
            -f event=APPROVE -f commit_id="$TESTED_SHA" \
            -f body='Dependabot update: all reported PR checks passed for this commit.' \
            --jq '.html_url'
